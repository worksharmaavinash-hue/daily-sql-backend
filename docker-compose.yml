version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: dailysql-postgres-experimental
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dailysql
    ports:
      - "5432:5432"
    volumes:
      - dailysql_pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: dailysql-api-experimental
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/dailysql
      REDIS_URL: redis://redis:6379
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: mysql
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres
      - redis
      - mysql
      - python-runner
      - pyspark-runner
    networks:
      - default
      - runner-net

  redis:
    image: redis:7
    container_name: dailysql-redis-experimental
    ports:
      - "6379:6379"

  mysql:
    image: mysql:8.0
    container_name: dailysql-mysql-experimental
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: dailysql_meta
    ports:
      - "33066:3306"
    volumes:
      - dailysql_mysqldata:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  python-runner:
    build:
      context: ./runners/python
    container_name: dailysql-python-runner-experimental
    image: dailysql-python-runner:latest
    ports:
      - "5001:5001"
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - runner-net

  # PySpark Execution Sandbox
  pyspark-runner:
    build:
      context: ./runners/pyspark
    container_name: dailysql-pyspark-runner-experimental
    image: dailysql-pyspark-runner:latest
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx768m
    ports:
      - "5002:5002"
    restart: always
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: '1.0'
    networks:
      - runner-net



  prometheus:
    image: prom/prometheus:latest
    container_name: dailysql-prometheus-experimental
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - api
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: dailysql-grafana-experimental
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - default

networks:
  runner-net:

volumes:
  dailysql_pgdata:
  dailysql_mysqldata:

