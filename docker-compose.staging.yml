version: '3.8'

services:
  # Backend API (Staging)
  dailysql-api-staging:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailysql_api_test
    restart: always
    env_file: .env
    environment:
      MYSQL_HOST: dailysql-mysql-staging
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
    ports:
      - "8001:8000"
    depends_on:
      - dailysql-postgres-staging
      - dailysql-redis-staging
      - dailysql-mysql-staging
      - python-runner-staging
      - pyspark-runner-staging
    networks:
      - dailysql-test-network
      - runner-test-net

  # Database (Staging)
  dailysql-postgres-staging:
    image: postgres:15-alpine
    container_name: dailysql_postgres_test
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    networks:
      - dailysql-test-network

  # Redis Cache (Staging)
  dailysql-redis-staging:
    image: redis:7-alpine
    container_name: dailysql_redis_test
    restart: always
    networks:
      - dailysql-test-network

  # MySQL (Staging)
  dailysql-mysql-staging:
    image: mysql:8.0
    container_name: dailysql_mysql_test
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
      MYSQL_DATABASE: dailysql_meta
    volumes:
      - mysql_data_test:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - dailysql-test-network

  # Python Execution Sandbox (Staging)
  python-runner-staging:
    build:
      context: ./runners/python
    container_name: dailysql_python_runner_test
    image: dailysql-python-runner:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - runner-test-net

  # PySpark Execution Sandbox (Staging)
  pyspark-runner-staging:
    build:
      context: ./runners/pyspark
    container_name: dailysql_pyspark_runner_test
    image: dailysql-pyspark-runner:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
    networks:
      - runner-test-net

volumes:
  postgres_data_test:
  mysql_data_test:

networks:
  dailysql-test-network:
    driver: bridge
  runner-test-net:
    driver: bridge
    internal: true
