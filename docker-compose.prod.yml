version: '3.8'

services:
  # Backend API
  dailysql-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dailysql_api_prod
    restart: always
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      MYSQL_HOST: dailysql-mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
    depends_on:
      - dailysql-postgres
      - dailysql-redis
      - dailysql-mysql
      - python-runner
      - pyspark-runner
    networks:
      - dailysql-network
      - runner-net

  # Database
  dailysql-postgres:
    image: postgres:15-alpine
    container_name: dailysql_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - dailysql-network

  # Redis Cache
  dailysql-redis:
    image: redis:7-alpine
    container_name: dailysql_redis_prod
    restart: always
    networks:
      - dailysql-network

  # MySQL (for dual-dialect SQL execution)
  dailysql-mysql:
    image: mysql:8.0
    container_name: dailysql_mysql_prod
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
      MYSQL_DATABASE: dailysql_meta
    volumes:
      - mysql_data_prod:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - dailysql-network

  # Python Execution Sandbox
  python-runner:
    build:
      context: ./runners/python
    container_name: dailysql_python_runner_prod
    image: dailysql-python-runner:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    networks:
      - runner-net

  # PySpark Execution Sandbox
  pyspark-runner:
    build:
      context: ./runners/pyspark
    container_name: dailysql_pyspark_runner_prod
    image: dailysql-pyspark-runner:latest
    restart: always
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
    networks:
      - runner-net

  # Caddy Reverse Proxy & HTTPS
  caddy:
    image: caddy:2-alpine
    container_name: dailysql_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dailysql-api
    networks:
      - dailysql-network

volumes:
  postgres_data_prod:
  mysql_data_prod:
  caddy_data:
  caddy_config:

networks:
  dailysql-network:
    driver: bridge
  runner-net:
    driver: bridge
    internal: true

